name: Build Windows x86-64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build FolderSweep.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable x86-64 MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/FolderSweep.exe"
          if (!(Test-Path $exe)) {
            throw "FolderSweep.exe was not generated at $exe"
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload Windows x86-64 executable
        uses: actions/upload-artifact@v4
        with:
          name: FolderSweep-Windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/FolderSweep.exe
          if-no-files-found: error
          retention-days: 30
