[package]
name = "foldersweep"
version = "1.0.0"
edition = "2024"
build = "build.rs"
description = "Remove pastas vazias dos caminhos que você marcar"

# O nome do pacote é o da crate, e crate em Rust é minúscula por convenção. O
# executável não precisa herdar isso: um alvo `[[bin]]` explícito nomeia o
# arquivo que sai do build, e é esse nome que aparece no Explorer.
[[bin]]
name = "FolderSweep"
path = "src/main.rs"

[dependencies]
slint = { version = "1.17.1", features = ["renderer-software", "backend-winit"] }
sysinfo = "0.39.6"
dirs = "6.0.0"
rfd = { version = "0.17.2", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1.17.1"
winresource = "0.1.31"

# Nada aqui altera o conjunto de instruções gerado — quem faz isso é
# `target-cpu`, em `.cargo/config.toml`. Estas chaves mexem só em tamanho e
# tempo de build, e são seguras em qualquer x86-64.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Perfil de iteração: mesmo comportamento otimizado do release, sem pagar o
# build de distribuição. `cargo build --profile fast`, saída em `target/fast/`.
#
# O que muda em relação ao release, e por quê:
#   opt-level 2   — otimiza para velocidade em vez de tamanho; compila mais
#                   rápido que `z`, que gasta passes extras só para encolher.
#   lto = false   — o release usa LTO *fat*, que reotimiza a árvore inteira
#                   num único passo de link. É o item mais caro do build, e
#                   não muda o comportamento do programa.
#   codegen-units — 1 serializa a geração de código num núcleo só. 16 usa os 8
#                   disponíveis; o custo é binário um pouco maior.
#   incremental   — reaproveita a compilação anterior entre rebuilds.
#
# `panic = "abort"` fica herdado do release de propósito: é a única dessas
# chaves que muda semântica em runtime, então o perfil de teste precisa dela
# para valer como teste.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false
incremental = true
debug = "line-tables-only"